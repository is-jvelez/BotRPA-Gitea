<!DOCTYPE html>
<!-- Fixture modelado sobre Gitea 28.2: /{owner}/{repo} (repo con commits) -->
<html lang="en"><head><meta charset="utf-8"><title>{{KEY}}</title></head>
<body>
<div class="repository file list">
	<div class="ui segments repository-summary">
		<div class="ui segment sub-menu repository-menu">
			<a class="item muted " href="/{{KEY}}/commits/branch/{{DEFAULT}}">
				<svg viewBox="0 0 16 16" class="svg octicon-history" aria-hidden="true" width="16" height="16"></svg> <b>{{DEFAULT_COMMITS}}</b> Commits
			</a>
			<a class="item muted " href="/{{KEY}}/branches">
				<svg viewBox="0 0 16 16" class="svg octicon-git-branch" aria-hidden="true" width="16" height="16"></svg> <b>{{BRANCHES}}</b> Branches
			</a>
			<a class="item muted " href="/{{KEY}}/tags"><svg class="svg octicon-tag"></svg> <b>0</b> Tags</a>
		</div>
	</div>
	<div id="repo-files-table">
		{{FILES}}
	</div>
	<div class="repo-home-sidebar">
		<div class="flex-relaxed-list">
			<div class="repo-home-sidebar-header">Description</div>
			{{DESCRIPTION}}
		</div>
	</div>
</div>
</body></html>
